name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install python-docx
      - name: Lint skills
        run: python tools/lint_skills.py
      - name: Shared files in sync
        run: python tools/sync_shared.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Evaluations (guardrails)
        run: python evals/run_evals.py

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package_skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.zip
      - name: Attach skill zips to the release
        if: github.event_name == 'release'  # one uploader per release, so tag and release runs never race
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
